services:
  mongo-hot:
    image: mongo
    container_name: mongo-hot
    restart: always
    ports:
      - 27017:27017   #
    environment:
      MONGO_INITDB_ROOT_USERNAME: root  # 初始化 root 用户名
      MONGO_INITDB_ROOT_PASSWORD: 123456  # 初始化 root 密码
    networks:
      - ldl_network

networks:
  ldl_network:
    driver: bridge