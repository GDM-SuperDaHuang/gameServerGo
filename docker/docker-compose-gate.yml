services:
  smash-gate-1:
    image: gate2.2:latest
    container_name: smash-gate-1
    ports:
      - "7001:7001"
      - "7051:7051"
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - ./excels:/app/excels
    networks:
      - smash_game_network

networks:
  smash_game_network:
    external: true