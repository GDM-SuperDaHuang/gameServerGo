services:
  mongodb:
    image: mongo:8.0.32
    container_name: ldl.mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: caJ6nmNs2ANV3GQvubdy
    volumes:
      - ./storage/mongodb:/data/db
      - ./storage/mongodb_config:/data/configdb
    command: mongod --auth
    networks:
      - ldl_network
networks:
  ldl_network:
    driver: bridge