services:
  mongodb:
    image: mongo:7.0
    container_name: prod-smash-mongodb

    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}

    command:
      - mongod
      - --auth
      - --bind_ip_all

    volumes:
      - mongo-data:/data/db
      - mongo-configdb:/data/configdb

    ports:
      - "27017:27017"

    healthcheck:
      test:
        - CMD-SHELL
        - >
          mongosh --quiet
          -u "$$MONGO_INITDB_ROOT_USERNAME"
          -p "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval 'db.adminCommand("ping")'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  mongo-data:
    name: smash-mongodb-data

  mongo-configdb:
    name: smash-mongodb-configdb