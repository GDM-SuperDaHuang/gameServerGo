      NODE_NAME: room-2
      ETCD_ADDRESS: *etcd-cluster
      REDIS_ADDR: "host.docker.internal:6379"
    configs:
      - source: room_toml
        target: /app/config/room.toml
    ports:
      - target: 7082
        published: 7082
        protocol: tcp
        mode: ingress
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
