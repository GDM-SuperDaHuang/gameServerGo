        protocol: tcp
        mode: ingress
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 15s
        failure_action: rollback
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  room-2:
    <<: *game-defaults
    image: ${ROOM_IMAGE:-room:prod}
    hostname: "room-2"
