      replicas: 1
      update_config:
        parallelism: 1
        delay: 15s
        failure_action: rollback
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  home-2:
    <<: *game-defaults
    image: ${HOME_IMAGE:-home:prod}
    hostname: "home-2"
    environment:
      NODE_NAME: home-2
