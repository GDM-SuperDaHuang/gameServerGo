services:
  home:
    image: room1.0:latest

    volumes:
      - /home/game/smash/room/config:/config:ro
      - /home/game/smash/room/logs:/logs
      - /home/game/smash/room/excels:/excels

    ports:
      - target: 7061
        published: 7061
        protocol: tcp
        mode: host

    networks:
      - smash_game_network

    environment:
      NODE_NAME: "room-1"

    deploy:
      replicas: 1

      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 30s

      placement:
        constraints:
          - node.labels.game_role == smash_room # 只能在机器标签为swarm-home上运行，对应docker node update --label-add game_role=smash_home swarm-worker-gate

networks:
  smash_game_network:
    external: true