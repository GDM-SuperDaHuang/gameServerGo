services:
  gate:
    image: gate1.0:latest

    volumes:
      - D:/Work/gameServerGo/config:/app/config:ro
      - D:/Work/gameServerGo/logs:/app/logs
      - D:/Work/gameServerGo/excels:/app/excels

    ports:
      - target: 7001
        published: 7001
        protocol: tcp
        mode: host

      - target: 7051
        published: 7051
        protocol: tcp
        mode: host

    networks:
      - smash_game_network

    environment:
      NODE_NAME: "gate-1"

    deploy:
      replicas: 1

      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 30s

networks:
  smash_game_network:
    external: true