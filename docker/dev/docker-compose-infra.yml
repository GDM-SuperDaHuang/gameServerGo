# ============================================================================
# dev 基础设施: etcd(单节点) + redis + mongodb
# 不加入 swarm, 纯 docker compose 运行在宿主机上, 端口发布到宿主机,
# swarm 里的 gate/room/home 经 swarm 访问etcd + redis + mongodb.
#
# 启动: docker compose --env-file .env -f infra.yml up -d
# 停止: docker compose --env-file .env -f infra.yml down
#
# ============================================================================

services:
  etcd1:
    image: quay.io/coreos/etcd:v3.6.14
    container_name: prod-etcd1
    restart: unless-stopped

    networks:
      - etcd-net

    environment:
      ETCD_NAME: etcd1
      ETCD_DATA_DIR: /etcd-data

      # 客户端：外部通过宿主机 IP + 映射端口访问
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://192.168.2.81:2379

      # Peer：节点间通过容器名 + 内部端口通信
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://prod-etcd1:2380

      ETCD_INITIAL_CLUSTER: "etcd1=http://prod-etcd1:2380,etcd2=http://prod-etcd2:2380,etcd3=http://prod-etcd3:2380"
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: smash-etcd-local

    volumes:
      - ./etcd1-data:/etcd-data

    ports:
      - "2379:2379"
      # Peer 端口不需要对外暴露，仅集群内部使用
      # 如需对外提供 peer 调试，再单独映射

  etcd2:
    image: quay.io/coreos/etcd:v3.6.14
    container_name: prod-etcd2
    restart: unless-stopped

    networks:
      - etcd-net

    environment:
      ETCD_NAME: etcd2
      ETCD_DATA_DIR: /etcd-data

      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://192.168.2.81:22379

      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://prod-etcd2:2380

      ETCD_INITIAL_CLUSTER: "etcd1=http://prod-etcd1:2380,etcd2=http://prod-etcd2:2380,etcd3=http://prod-etcd3:2380"
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: smash-etcd-local

    volumes:
      - ./etcd2-data:/etcd-data

    ports:
      - "22379:2379"

  etcd3:
    image: quay.io/coreos/etcd:v3.6.14
    container_name: prod-etcd3
    restart: unless-stopped

    networks:
      - etcd-net

    environment:
      ETCD_NAME: etcd3
      ETCD_DATA_DIR: /etcd-data

      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://192.168.2.81:32379

      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://prod-etcd3:2380

      ETCD_INITIAL_CLUSTER: "etcd1=http://prod-etcd1:2380,etcd2=http://prod-etcd2:2380,etcd3=http://prod-etcd3:2380"
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: smash-etcd-local

    volumes:
      - ./etcd3-data:/etcd-data

    ports:
      - "32379:2379"

networks:
  etcd-net:
    driver: bridge

volumes:
  etcd1-data:
  etcd2-data:
  etcd3-data: