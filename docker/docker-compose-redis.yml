services:
  redis:
    image: redis:8.10.2-trixie
    container_name: ldl.redis
    command: redis-server --requirepass FAFH3F4bzJGAJMr8H2Fy --appendonly yes
    ports:
      - "6379:6379"
    restart: always
    volumes:
      - ./storage/redis:/data
    networks:
      - ldl_network
networks:
  ldl_network:
    driver: bridge