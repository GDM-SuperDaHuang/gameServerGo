# 节点: 网关
[gate]
# 是否开启消息压缩
whethercompress = false
# 压缩的阈值，当消息负载 payload 长度不小于该值时才会压缩
compressthreshold = 1024
# 是否需要对消息负载 payload 进行加密
whethercrypto = false
# 是否启用校验值功能
whetherchecksum = false
# 线程池容量
poolsize = 999

[gate-1]
# 节点编号，所有节点中唯一 范围1~999
Id = 1
# 名称
name = "gate-1"
# 版本号
version = 0
# 监听地址
address = ":7001"
# 性能监控地址
pprofaddr = ":7051"

[gate-2]
# 节点编号，所有节点中唯一
