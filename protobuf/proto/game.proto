syntax = "proto3";
package game;
option go_package = "gameServer/protobuf/pbGo";
import "skill.proto";

// 开始游戏 2005
message StartGameReq{
}
message StartGameResp {
}

// 死亡请求
message DeathReq{
  repeated uint32 MonsterId = 1; // 怪物类型id 列表
}
message DeathResp {
  repeated itemInfo itemList=1;//死亡爆率东西
}

// 游戏结束请求
message GameOverReq{
  int32 precision  = 1; // 精准度
}
message GameOverResp {
  int32 precisionExtraGold   = 1; // 命中精准度额外金币
  repeated itemInfo itemInfoList = 2;//奖励信息,里面可能包含收藏品
  BillInfo billInfo = 3;//账单信息
  repeated uint32 MonsterIdList=4;//死亡怪物id列表
  MonsterInfo UnlockMonsterInfo =5;//待解锁怪物
}

// 查询自身道具 2001
message playerInfoResp {
  repeated itemInfo itemList=1;
  repeated MonsterInfo MonsterInfoList=2;
  repeated skill.skillInfo skillInfo = 3;
}

// 购买道具 2002
message buyItemRep {
  itemInfo item = 1;
}
message buyItemResp {
}


// 账单信息
message BillInfo{
  uint32 allBonus = 1 ;// 总计算
  uint32 UnpaidRatio  = 2;//未支付分成比例，四舍五入 todo
  uint32 youBonus = 4;//你的奖励
}
// 怪物信息
message MonsterInfo {
  uint32 id=1;//怪物类型id
  uint32 level=2;//怪物等级
  uint32 UnlockProgress = 3;//解锁进度
}

// 道具信息
message itemInfo {
  uint64 itemId = 1; // 道具id,
  int64 count = 2;  //道具数量
}


